name: TikTok connection check

on:
  push:
    paths:
      - '.github/workflows/check-tiktok.yml'
      - 'monitor/collector.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktok-connection-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check TikTok without sending or saving
        run: python -m monitor --dry-run
