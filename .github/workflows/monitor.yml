name: TikTok monitor

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      initialize:
        description: '初回のみON。過去動画を通知せず基準を保存'
        type: boolean
        default: false
      dry_run:
        description: '取得・判定のみ（通知・状態保存なし）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tiktok-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate configuration
        run: python -m monitor --validate-config
      - name: Collect and notify
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          INITIALIZE: ${{ inputs.initialize }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          args=(--github-state)
          if [[ "$INITIALIZE" == "true" ]]; then args+=(--initialize); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python -m monitor "${args[@]}"
