name: Tests
on:
  push:
    branches-ignore: [monitor-state]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser for isolated integration tests
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -v
        env:
          RUN_BROWSER_TESTS: '1'
      - run: python -m monitor --validate-config
      - run: python -m monitor --config examples/config.multiple.json --validate-config
